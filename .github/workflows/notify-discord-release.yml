name: Notify Discord about releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing public release tag to announce (for example v0.9.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send public application release to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from urllib.parse import quote
          webhook = os.environ.get('DISCORD_WEBHOOK_URL', '').strip()
          if not re.fullmatch(r'https://(?:discord\.com|discordapp\.com)/api/webhooks/\d+/[A-Za-z0-9_.-]+', webhook):
              raise SystemExit('Configure the DISCORD_WEBHOOK_URL repository secret with a Discord webhook URL.')
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)
          repo = os.environ['GITHUB_REPOSITORY']
          tag = event.get('release', {}).get('tag_name') or os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Only stable application version tags can be announced.')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/releases/tags/{quote(tag, safe="")}',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'User-Agent': 'miixprokey-release'})
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          if release['draft'] or release['prerelease']:
              raise SystemExit('Only published stable releases can be announced.')
          prefix = f'https://github.com/{repo}/releases/download/{tag}/'
          asset = next((a for a in release['assets'] if a['name'].endswith('_x64-setup.exe')
                        and a['browser_download_url'].startswith(prefix)), None)
          if not asset:
              raise SystemExit('The public Windows installer is missing; no notification sent.')
          notes = release.get('body') or 'See the release page for details.'
          if len(notes) > 3500:
              notes = notes[:3500] + '\n\nRead the full notes on GitHub.'
          payload = {'username': 'miixprokey Updates', 'allowed_mentions': {'parse': []},
                     'embeds': [{'title': (release.get('name') or tag)[:256],
                       'url': release['html_url'], 'description': notes, 'color': 3542968,
                       'fields': [{'name': 'Windows 11 x64', 'value': '[Download installer](' + asset['browser_download_url'] + ')'}],
                       'footer': {'text': repo + ' • ' + tag}}]}
          request = urllib.request.Request(webhook + '?wait=true',
              data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json',
              'User-Agent': 'miixprokey-release'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if not result.get('id'):
                  raise SystemExit('Discord did not return a message confirmation.')
          except urllib.error.HTTPError as error:
              raise SystemExit(f'Discord rejected the notification (HTTP {error.code}).') from None
          except urllib.error.URLError:
              raise SystemExit('Discord delivery is uncertain. Check the channel before rerunning.') from None
          print('Discord confirmed the release notification.')
          PY
